[package]
name = "basalt"
version = "0.1.0"
edition = "2024"
default-run = "basalt"

[dependencies]
chumsky = { version = "0.10.1", features = ["either", "pratt"] }
ariadne = "0.4.1"
clap = { version = "4.5.4", features = ["derive"] }
either = "1.9.0"
wasm-encoder = "0.235.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "fs", "time"] }
tower-lsp = "0.20"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "lsp-server"
path = "src/bin/lsp_server.rs"
